# 银商生产环境（《银杏盾开放平台 v2.0.1》）
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=ums-prod
#
# 环境变量（生产套，切勿与测试混用）：
#   CHINAUMS_PROD_APP_ID
#   CHINAUMS_PROD_APP_KEY
#   CHINAUMS_PROD_PRIVATE_KEY
#   CHINAUMS_PROD_PLATFORM_PUBLIC_KEY  （可选）
#   CHINAUMS_PROD_USER_NO              （可选，默认 08）
chinaums:
  env: prod
  app-id: ${CHINAUMS_PROD_APP_ID:}
  app-key: ${CHINAUMS_PROD_APP_KEY:}
  private-key: ${CHINAUMS_PROD_PRIVATE_KEY:}
  platform-public-key: ${CHINAUMS_PROD_PLATFORM_PUBLIC_KEY:0414bb7e9c3914bb65b85079b1dc6e1ca2a0ee04dd9bb55b2f8d31704a6dec0cca695739e128f9c931330e1c0f493be4d56244236434c9d344c4716ba64a4470ba}
  check-url: https://api-mop.chinaums.com/v1/datacenter/smartverification/encrypted/assistant/info/check
  query-url: https://api-mop.chinaums.com/v1/datacenter/smartverification/encrypted/assistant/info/query
  default-user-no: ${CHINAUMS_PROD_USER_NO:08}
