<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>业务方接入测试 · 叮咚保险</title>
<style>
  :root{
    --bg:#0b1020; --card:#151b2e; --line:#26304a; --text:#e6e9f2; --sub:#9aa3b8;
    --brand:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --mono:#cbd5e1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:18px;margin:4px 0 2px}
  .sub{color:var(--sub);font-size:12px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input{width:100%;background:#0e1424;border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:10px 12px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
  .seg{display:flex;gap:8px;margin-bottom:6px}
  .seg button{flex:1;background:#0e1424;border:1px solid var(--line);color:var(--text);
    padding:10px;border-radius:10px;font-size:14px;cursor:pointer}
  .seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .go{width:100%;margin-top:14px;background:var(--brand);border:0;color:#fff;
    padding:14px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
  .go:disabled{opacity:.5}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--sub)}
  .row .v{color:var(--mono);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;text-align:right}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.err{color:var(--err);border-color:var(--err)}
  .pill.run{color:var(--warn);border-color:var(--warn)}
  #log{background:#080d1a;border:1px solid var(--line);border-radius:12px;padding:10px;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-all;
    max-height:46vh;overflow:auto;color:#aeb8d0}
  .log-t{color:#5b6b8c}.log-ok{color:var(--ok)}.log-err{color:var(--err)}.log-warn{color:var(--warn)}.log-step{color:#7dd3fc}
  .note{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6}
  .clear{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;float:right}
</style>
</head>
<body>
  <h1>业务方接入测试 · 叮咚保险</h1>
  <p class="sub">通过我方 JSSDK 走完整链路：创建会话 → 拉起授权弹层 → 换取认证结果。可切换 测试 / 生产 两套 appId。</p>

  <div class="card">
    <div class="seg" id="seg">
      <button data-env="test" class="on">测试 appId</button>
      <button data-env="prod">生产 appId</button>
    </div>
    <label>appId（可编辑）</label>
    <input id="appId" />
    <label>appKey（可编辑）</label>
    <input id="appKey" />
    <button class="go" id="go">开始认证测试</button>
  </div>

  <div class="card">
    <div class="row"><span class="k">状态</span><span class="v"><span id="state" class="pill">待开始</span></span></div>
    <div class="row"><span class="k">launchToken</span><span class="v" id="r-launch">—</span></div>
    <div class="row"><span class="k">authToken</span><span class="v" id="r-authtoken">—</span></div>
    <div class="row"><span class="k">姓名</span><span class="v" id="r-name">—</span></div>
    <div class="row"><span class="k">手机号</span><span class="v" id="r-mobile">—</span></div>
    <div class="row"><span class="k">身份证</span><span class="v" id="r-idcard">—</span></div>
  </div>

  <div class="card">
    <button class="clear" id="clear">清空日志</button>
    <label style="margin-top:0">链路日志（含每步请求/响应与报错）</label>
    <div id="log"></div>
    <p class="note">说明：本页为接入联调测试页，appKey 直接放在前端仅为测试便利；正式接入应由业务方服务端持有 appKey、前端只拿 launchToken。</p>
  </div>

<script type="module">
import { createAssistanceMobileAuthSdk } from '/sign-pay-pro/assistance-mobile-auth/assistance-mobile-auth.js'

const CREDS = {
  test: { appId: '10037e6f9d903f86019eed0df39e0367', appKey: 'YOUR_CUSTOMER_APP_KEY' },
  prod: { appId: '8a9481c79c05c8bd019eed11ac2b1e79', appKey: 'YOUR_CUSTOMER_APP_KEY' },
}
const API = '/sign-pay-pro/api/sdk/session'
const $ = (id) => document.getElementById(id)
const logEl = $('log')

function ts(){ const d = new Date(); return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0') }
function log(msg, cls){ const line = document.createElement('div'); if(cls) line.className = cls
  line.innerHTML = `<span class="log-t">${ts()}</span>  ${msg}`; logEl.appendChild(line); logEl.scrollTop = logEl.scrollHeight }
function step(s){ log('▶ ' + s, 'log-step') }
function ok(s){ log('✓ ' + s, 'log-ok') }
function err(s){ log('✗ ' + s, 'log-err') }
function warn(s){ log('! ' + s, 'log-warn') }
function dump(label, obj){ log(label + ' ' + JSON.stringify(obj)) }
function setState(text, cls){ const el = $('state'); el.textContent = text; el.className = 'pill ' + (cls||'') }

function applyEnv(env){
  $('appId').value = CREDS[env].appId
  $('appKey').value = CREDS[env].appKey
  for(const b of document.querySelectorAll('#seg button')) b.classList.toggle('on', b.dataset.env === env)
}
$('seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if(b) applyEnv(b.dataset.env) })
$('clear').addEventListener('click', () => { logEl.innerHTML = '' })
applyEnv('test')

async function postJson(path, body){
  const res = await fetch(API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
  let data; const text = await res.text()
  try{ data = JSON.parse(text) }catch{ data = text }
  return { status: res.status, data }
}

$('go').addEventListener('click', async () => {
  const appId = $('appId').value.trim(), appKey = $('appKey').value.trim()
  if(!appId || !appKey){ warn('请填写 appId 与 appKey'); return }
  $('go').disabled = true
  for(const k of ['r-launch','r-authtoken','r-name','r-mobile','r-idcard']) $(k).textContent = '—'
  const requestId = 'biztest-' + Date.now() + '-' + Math.random().toString(36).slice(2,8)
  setState('进行中', 'run')
  log('──────── 新一次测试 ────────')
  log('appId=' + appId)
  log('requestId=' + requestId + '（可在 BFF verify-trace 日志里对照）')

  try{
    // ① 创建会话
    step('① POST /create 申请 launchToken')
    const create = await postJson('/create', { appId, appKey, scene:'native-number', requestId })
    dump('  ← http=' + create.status, create.data)
    if(create.status !== 200 || create.data?.kind !== 'created'){ err('createSession 失败'); setState('createSession 失败','err'); return }
    const launchToken = create.data.launchToken
    $('r-launch').textContent = launchToken
    ok('launchToken=' + launchToken)

    // ② 拉起授权弹层
    step('② sdk.open() 拉起授权弹层')
    const sdk = createAssistanceMobileAuthSdk({
      appId: 'demo-brand-001',
      authWindowTitle: '银杏助理认证',
      onReady: () => ok('授权页就绪 onReady'),
      onErrorNotice: (p) => warn('非终态通知 onErrorNotice: ' + JSON.stringify(p)),
      onError: (p) => err('授权失败 onError: ' + JSON.stringify(p)),
      onCancel: () => warn('用户取消 onCancel'),
      onClose: () => warn('窗口关闭 onClose'),
    })
    let result
    try{
      result = await sdk.open({ scene:'native-number', launchToken, requestId })
    }catch(e){ err('open() reject: ' + (e?.message || e)); setState('授权未完成','err'); return }
    dump('  ← onSuccess payload', result)
    ok('授权成功，拿到结果凭证')
    $('r-authtoken').textContent = result.authToken || '(无 authToken，用 authResultId+authCode)'

    // ③ 换取认证结果
    step('③ POST /result 换取认证结果')
    const resultBody = result.authToken
      ? { appId, appKey, authToken: result.authToken }
      : { appId, appKey, authResultId: result.authResultId, authCode: result.authCode }
    const q = await postJson('/result', resultBody)
    dump('  ← http=' + q.status, q.data)
    if(q.status !== 200 || q.data?.kind !== 'identity-ready'){ err('queryResult 失败'); setState('取结果失败','err'); return }
    const id = q.data.identity || {}
    $('r-name').textContent = id.displayName || '—'
    $('r-mobile').textContent = id.maskedMobile || '—'
    $('r-idcard').textContent = id.maskedIdCard || '—'
    ok('认证完成 ✅' + (q.data.mock ? '（mock）' : ''))
    setState('成功', 'ok')
  }catch(e){
    err('异常: ' + (e?.stack || e?.message || e)); setState('异常','err')
  }finally{
    $('go').disabled = false
  }
})

log('页面已加载。当前 wrapper: /sign-pay-pro/assistance-mobile-auth/assistance-mobile-auth.js')
log('提示：需在手机移动网络（中国移动号码）下测试取号。')
</script>
</body>
</html>
